<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="robots" content="index, follow" />
<title>日本全国市町村紹介</title>
<script>
(function () {
  var langs = (navigator.languages && navigator.languages.length)
    ? navigator.languages
    : [navigator.language || 'ja'];
  var loc = 'ja';
  for (var i = 0; i < langs.length; i++) {
    var tag = String(langs[i] || '').toLowerCase();
    if (tag.indexOf('ja') === 0) { loc = 'ja'; break; }
    if (tag.indexOf('en') === 0) { loc = 'en'; break; }
  }
  location.replace('./' + loc + '/');
})();
</script>
</head>
<body>
<p><a href="./ja/">日本語</a> · <a href="./en/">English</a></p>
</body>
</html>
